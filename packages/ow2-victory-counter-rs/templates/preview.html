<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Counter Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #1a1c2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 100px;
    }
    #obs-frame {
      display: block;
      border: none;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.15), 0 8px 32px rgba(0,0,0,0.5);
      background: transparent;
    }
    .preview-controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 24px;
      border-radius: 14px;
      background: rgba(30, 34, 56, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      font-family: system-ui, sans-serif;
      z-index: 100;
      flex-wrap: wrap;
      max-width: calc(100vw - 40px);
    }
    .preview-controls button {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .preview-controls button:hover { opacity: 0.85; }
    .btn-victory { background: #F9A825; color: #1a1c2a; }
    .btn-defeat { background: #E44848; color: #fff; }
    .btn-reset { background: rgba(255,255,255,0.12); color: #ccc; }
    .bg-selector {
      display: flex;
      gap: 6px;
      margin-left: 12px;
      padding-left: 12px;
      border-left: 1px solid rgba(255,255,255,0.15);
    }
    .bg-selector button {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.2);
      padding: 0;
      cursor: pointer;
      font-size: 0;
    }
    .bg-selector button.active { border-color: #F9A825; }
    .bg-dark { background: #1a1c2a; }
    .bg-game1 { background: linear-gradient(135deg, #2c3e50, #1a252f); }
    .bg-game2 { background: linear-gradient(135deg, #4a2c1a, #1a1210); }
    .bg-bright { background: #8fa4b8; }
    .size-inputs {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-left: 12px;
      padding-left: 12px;
      border-left: 1px solid rgba(255,255,255,0.15);
      color: #ccc;
      font-size: 13px;
    }
    .size-inputs label { color: #aaa; }
    .size-inputs input[type="number"] {
      width: 60px;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 13px;
      text-align: center;
    }
    .css-section {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: 12px;
      padding-left: 12px;
      border-left: 1px solid rgba(255,255,255,0.15);
    }
    .css-section label { color: #aaa; font-size: 13px; white-space: nowrap; }
    .css-section textarea {
      width: 260px;
      height: 38px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 11px;
      resize: vertical;
      font-family: monospace;
    }
    .css-section textarea:focus { outline: 1px solid #F9A825; }
  </style>
</head>
<body>
  <iframe id="obs-frame" width="640" height="400"></iframe>

  <div class="preview-controls">
    <button class="btn-victory" onclick="addVictory()">+ Victory</button>
    <button class="btn-defeat" onclick="addDefeat()">+ Defeat</button>
    <button class="btn-reset" onclick="resetAll()">Reset</button>
    <div class="bg-selector">
      <button class="bg-dark active" title="Dark" onclick="setBg(this, '#1a1c2a')"></button>
      <button class="bg-game1" title="Cool game" onclick="setBg(this, 'linear-gradient(135deg, #2c3e50, #1a252f)')"></button>
      <button class="bg-game2" title="Warm game" onclick="setBg(this, 'linear-gradient(135deg, #4a2c1a, #1a1210)')"></button>
      <button class="bg-bright" title="Bright" onclick="setBg(this, '#8fa4b8')"></button>
    </div>
    <div class="size-inputs">
      <label>W</label>
      <input type="number" id="frame-width" value="640" min="100" max="3840" onchange="resizeFrame()" />
      <label>H</label>
      <input type="number" id="frame-height" value="400" min="100" max="2160" onchange="resizeFrame()" />
    </div>
    <div class="css-section">
      <label>OBS CSS</label>
      <textarea id="obs-css" onchange="rebuildIframe()">body { background-color: rgba(0, 0, 0, 0); margin: 0px auto; overflow: hidden; }</textarea>
    </div>
  </div>

  <script>
    let victories = 0;
    let defeats = 0;

    const COUNTER_HTML = `
      <div class="counter-container">
        <div class="scoreboard">
          <div class="scoreboard-labels">
            <span class="label label-victory">Victory</span>
            <span class="label-spacer" aria-hidden="true"></span>
            <span class="label label-defeat">Defeat</span>
          </div>
          <div class="scoreboard-score">
            <span class="value value-victory" data-counter="victories">0</span>
            <span class="separator">—</span>
            <span class="value value-defeat" data-counter="defeats">0</span>
          </div>
          <div class="scoreboard-winrate">
            <div class="winrate-bar">
              <div class="winrate-fill" data-style="winrate-width" style="width: 0%"></div>
            </div>
            <div class="winrate-meta">
              <span class="winrate-label">Winrate</span>
              <span class="winrate-value" data-meta="winrate">0%</span>
            </div>
          </div>
          <div class="last-update" data-meta="last-updated">Standby</div>
        </div>
      </div>
    `;

    const MOCK_SCRIPT = `
      (function() {
        var _originalFetch = window.fetch;
        window.fetch = function(url, opts) {
          if (typeof url === "string" && url.includes("/api/status")) {
            return Promise.resolve(new Response(JSON.stringify({
              victories: 0, defeats: 0, draws: 0,
              last_outcome: "", timestamp: 0,
            }), { status: 200, headers: { "Content-Type": "application/json" } }));
          }
          return _originalFetch(url, opts);
        };

        window.EventSource = class FakeEventSource extends EventTarget {
          constructor() {
            super();
            window._fakeEventSource = this;
            this.readyState = 1;
          }
          close() { this.readyState = 2; }
        };
      })();
    `;

    function getBaseUrl() {
      return location.href.substring(0, location.href.lastIndexOf('/') + 1);
    }

    function buildIframeDoc() {
      const baseUrl = getBaseUrl();
      const obsCustomCss = document.getElementById('obs-css').value;
      return `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="${baseUrl}" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="counter.css" />
  <style>${obsCustomCss}</style>
</head>
<body>
${COUNTER_HTML}
  <script>${MOCK_SCRIPT}<\/script>
  <script src="counter.js"><\/script>
</body>
</html>`;
    }

    function rebuildIframe() {
      const iframe = document.getElementById('obs-frame');
      iframe.srcdoc = buildIframeDoc();

      // counter.js が EventSource を new する (FakeEventSource の constructor で
      // window._fakeEventSource がセットされる) のを待ってから fireUpdate する
      iframe.addEventListener('load', function onLoad() {
        iframe.removeEventListener('load', onLoad);
        // srcdoc ロード直後は counter.js の初期化がまだ終わっていない場合があるため
        // マイクロタスク後に送る
        setTimeout(function() { fireUpdate(''); }, 50);
      }, { once: true });
    }

    function fireUpdate(outcome) {
      const iframeWin = document.getElementById('obs-frame').contentWindow;
      if (!iframeWin || !iframeWin._fakeEventSource) return;
      const data = JSON.stringify({
        victories, defeats, draws: 0,
        last_outcome: outcome,
        timestamp: Math.floor(Date.now() / 1000),
      });
      const event = new iframeWin.MessageEvent('counter-update', { data });
      iframeWin._fakeEventSource.dispatchEvent(event);
    }

    function addVictory() { victories++; fireUpdate('victory'); }
    function addDefeat()  { defeats++;  fireUpdate('defeat'); }
    function resetAll()   { victories = 0; defeats = 0; fireUpdate(''); }

    function setBg(btn, value) {
      document.querySelectorAll('.bg-selector button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.body.style.background = value;
    }

    function resizeFrame() {
      const iframe = document.getElementById('obs-frame');
      const w = parseInt(document.getElementById('frame-width').value, 10);
      const h = parseInt(document.getElementById('frame-height').value, 10);
      if (w > 0) iframe.width = w;
      if (h > 0) iframe.height = h;
    }

    // 初期構築
    rebuildIframe();
  </script>
</body>
</html>
