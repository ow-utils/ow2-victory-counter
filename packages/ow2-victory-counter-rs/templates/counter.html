<main class="counter-root">
  <section class="counter-grid">
    <div class="counter-card counter-card--victory">
      <span class="counter-label">Victory</span>
      <span class="counter-value" data-counter="victories">0</span>
    </div>
    <div class="counter-card counter-card--defeat">
      <span class="counter-label">Defeat</span>
      <span class="counter-value" data-counter="defeats">0</span>
    </div>
    <div class="counter-card counter-card--draw">
      <span class="counter-label">Draw</span>
      <span class="counter-value" data-counter="draws">0</span>
    </div>
  </section>

  <section class="counter-meta">
    <div class="counter-pill">
      <span class="counter-pill__label">Winrate</span>
      <span class="counter-pill__value" data-meta="winrate">0%</span>
    </div>
    <div class="counter-pill">
      <span class="counter-pill__label">Last</span>
      <span class="counter-pill__value" data-meta="last-outcome"></span>
    </div>
    <div class="counter-pill counter-pill--wide">
      <span class="counter-pill__label">Updated</span>
      <span class="counter-pill__value" data-meta="last-updated">更新なし</span>
    </div>
  </section>
</main>
