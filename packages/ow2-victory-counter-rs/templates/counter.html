<div class="counter-container">
  <div class="counter-grid">
    <div class="counter-item victory">
      <div class="label">Victory</div>
      <div class="value" data-counter="victories">0</div>
    </div>

    <div class="counter-item defeat">
      <div class="label">Defeat</div>
      <div class="value" data-counter="defeats">0</div>
    </div>
  </div>

  <div class="winrate">
    <div class="winrate-header">
      <span class="winrate-label">Winrate</span>
      <span class="winrate-value" data-meta="winrate">0%</span>
    </div>
    <div class="winrate-bar">
      <div
        class="winrate-fill"
        data-style="winrate-width"
        style="width: 0%"
      ></div>
    </div>
  </div>

  <div class="last-update" data-meta="last-updated">更新なし</div>
</div>
